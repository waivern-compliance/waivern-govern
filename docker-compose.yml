services:
  db:
    image: postgres:16-alpine
    container_name: govern-db
    environment:
      POSTGRES_USER: govern
      POSTGRES_PASSWORD: govern
      POSTGRES_DB: govern
    ports:
      - "55432:5432"
    volumes:
      - govern-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U govern -d govern"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  govern-pgdata:
